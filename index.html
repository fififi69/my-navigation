<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>新标签页</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: #0b0d12;
    -webkit-touch-callout: none;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    color: #fff;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ============ 壁纸层 ============ */
  #wallpaper {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-image:
      radial-gradient(ellipse at 20% 0%, #1b2a4a 0%, transparent 55%),
      radial-gradient(ellipse at 85% 100%, #2a1b3d 0%, transparent 55%);
    background-color: #0b0d12;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }

  /* ============ 页面容器 ============ */
  #pages {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: flex;
    height: 100dvh;
    width: 100vw;
    overflow: hidden;
    will-change: transform;
    transition: transform 380ms cubic-bezier(.25,.8,.35,1);
  }

  .page {
    flex: 0 0 100%;
    width: 100vw;
    height: 100dvh;
    display: flex;
    align-items: flex-end;   
    justify-content: center; /* 整体居中 */
    padding: 32px 16px; 
    padding-bottom: max(32px, env(safe-area-inset-bottom));
    overflow: hidden;
  }

  /* 使用 Flex 结合 wrap-reverse 实现从下往上堆叠 */
  .grid {
    display: flex;
    flex-wrap: wrap-reverse; /* 核心：反向换行，新行在上，底座在下 */
    justify-content: flex-start; /* 核心：行内元素左对齐，解决错位问题 */
    align-content: flex-start;   /* 在 wrap-reverse 下，start 代表底部 */
    gap: var(--gap-y, 24px) var(--gap-x, 24px);
    
    /* 精确控制宽度，保证每行刚好排下设定的列数 */
    width: calc(var(--cols, 5) * var(--icon-size, 64px) + (var(--cols, 5) - 1) * var(--gap-x, 24px));
    max-width: 100%;
  }

  /* ============ 单个图标 ============ */
  .item {
    flex: 0 0 var(--icon-size, 64px); /* 固定宽度，不可伸缩 */
    width: var(--icon-size, 64px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    color: #fff;
    border: none;
    background: none;
    padding: 0;
    font: inherit;
    cursor: pointer;
    outline: none;
    -webkit-user-drag: none;
    touch-action: none;
  }

  .item .icon {
    width: var(--icon-size, 64px);
    height: var(--icon-size, 64px);
    border-radius: calc(var(--icon-size, 64px) * 0.24);
    background: rgba(255,255,255,.14);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    box-shadow: 0 6px 18px rgba(0,0,0,.28);
    transition: transform .18s ease, background .18s ease;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    pointer-events: none;
  }

  .item:hover .icon {
    transform: translateY(-3px) scale(1.04);
    background: rgba(255,255,255,.24);
  }

  .item:active .icon { transform: scale(.96); }

  .item .icon img {
    width: 60%; height: 60%;
    object-fit: contain;
    pointer-events: none;
    -webkit-user-drag: none;
  }

  .item .icon .fallback {
    font-size: calc(var(--icon-size, 64px) * .4);
    font-weight: 600;
    color: #fff;
  }

  .item .label {
    font-size: clamp(11px, calc(var(--icon-size, 64px) * .21), 16px);
    line-height: 1.35;
    max-width: calc(var(--icon-size, 64px) + 24px);
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-shadow: 0 1px 4px rgba(0,0,0,.75);
    opacity: .92;
    pointer-events: none;
  }

  body:not(.show-label) .item .label { display: none; }

  /* 拖拽中的幽灵元素 */
  .item.ghost {
    position: fixed;
    left: 0; top: 0;
    z-index: 9999;
    pointer-events: none;
    opacity: .95;
    filter: drop-shadow(0 14px 28px rgba(0,0,0,.5));
    transition: none !important;
    animation: none !important;
  }
  .item.ghost .icon { transform: scale(1.06); }

  /* 被拖拽的原位占位 */
  .item.drag-source { opacity: 0; }

  /* ============ 入场动画 ============ */
  @keyframes riseIn {
    0%   { opacity: 0; transform: translateY(34px) scale(.92); }
    100% { opacity: 1; transform: translateY(0)    scale(1);  }
  }

  .item.enter {
    animation: riseIn .52s cubic-bezier(.22,.68,.32,1) both;
    animation-delay: calc(var(--idx, 0) * 45ms);
  }

  /* ============ 遮罩 ============ */
  #mask {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.35);
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s;
    z-index: 100;
  }
  #mask.show { opacity: 1; pointer-events: auto; }

  /* ============ 设置面板 ============ */
  #panel {
    position: fixed;
    top: 0; right: 0;
    width: 350px;
    max-width: 90vw;
    height: 100dvh;
    background: rgba(20,20,26,.84);
    backdrop-filter: blur(26px) saturate(1.5);
    -webkit-backdrop-filter: blur(26px) saturate(1.5);
    border-left: 1px solid rgba(255,255,255,.08);
    transform: translateX(100%);
    transition: transform .32s cubic-bezier(.22,.8,.3,1);
    z-index: 101;
    display: flex;
    flex-direction: column;
    color: #eee;
  }
  #panel.open { transform: translateX(0); }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px;
    border-bottom: 1px solid rgba(255,255,255,.07);
    flex: none;
  }
  .panel-header h2 { font-size: 15px; font-weight: 600; letter-spacing: .02em; }

  #btnClose {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,.08);
    color: #ddd;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    transition: background .18s;
  }
  #btnClose:hover { background: rgba(255,255,255,.18); }

  .panel-body {
    flex: 1;
    overflow-y: auto;
    padding: 18px 20px 48px;
    overscroll-behavior: contain;
  }
  .panel-body::-webkit-scrollbar { width: 6px; }
  .panel-body::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,.14);
    border-radius: 3px;
  }

  .sec { margin-bottom: 28px; }
  .sec h3 {
    font-size: 11px;
    font-weight: 600;
    color: rgba(255,255,255,.42);
    letter-spacing: .1em;
    margin-bottom: 14px;
  }

  .field-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 13px;
    font-size: 13px;
  }
  .field-row > label {
    flex: none;
    width: 70px;
    color: rgba(255,255,255,.75);
  }
  .field-row .val {
    flex: none;
    width: 44px;
    text-align: right;
    font-size: 12px;
    color: rgba(255,255,255,.45);
    font-variant-numeric: tabular-nums;
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    height: 4px;
    border-radius: 2px;
    background: rgba(255,255,255,.18);
    outline: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 15px; height: 15px;
    border-radius: 50%;
    background: #4f8cff;
    border: none;
    cursor: pointer;
    box-shadow: 0 1px 6px rgba(79,140,255,.55);
  }
  input[type="range"]::-moz-range-thumb {
    width: 15px; height: 15px;
    border-radius: 50%;
    background: #4f8cff;
    border: none;
    cursor: pointer;
  }

  input[type="checkbox"].switch {
    appearance: none;
    -webkit-appearance: none;
    width: 42px; height: 24px;
    border-radius: 12px;
    background: rgba(255,255,255,.15);
    position: relative;
    cursor: pointer;
    transition: background .2s;
    flex: none;
    margin-left: auto;
  }
  input[type="checkbox"].switch::after {
    content: '';
    position: absolute;
    top: 3px; left: 3px;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: #fff;
    transition: transform .2s;
  }
  input[type="checkbox"].switch:checked { background: #4f8cff; }
  input[type="checkbox"].switch:checked::after { transform: translateX(18px); }

  .btn {
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.08);
    color: #eee;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    transition: background .18s, border-color .18s;
  }
  .btn:hover { background: rgba(255,255,255,.16); }
  .btn.small { padding: 6px 10px; font-size: 12px; }
  .btn.ghost { background: transparent; }
  .btn.ghost:hover { background: rgba(255,255,255,.1); }

  .btn-row { display: flex; gap: 8px; margin-bottom: 10px; }

  .field {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .field input[type="text"] {
    flex: 1;
    min-width: 0;
    padding: 7px 10px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,.1);
    background: rgba(0,0,0,.25);
    color: #eee;
    font-size: 12px;
    font-family: inherit;
    outline: none;
  }
  .field input[type="text"]:focus { border-color: rgba(79,140,255,.6); }
  .field input[type="text"]::placeholder { color: rgba(255,255,255,.28); }

  /* 网站列表 */
  .site-row {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 5px;
    padding: 9px 34px 9px 10px;
    background: rgba(255,255,255,.045);
    border-radius: 9px;
    margin-bottom: 8px;
  }
  .site-row input {
    width: 100%;
    padding: 5px 8px;
    border-radius: 6px;
    border: 1px solid transparent;
    background: rgba(0,0,0,.22);
    color: #ddd;
    font-size: 12px;
    font-family: inherit;
    outline: none;
  }
  .site-row input:focus { border-color: rgba(79,140,255,.55); }
  .site-row input::placeholder { color: rgba(255,255,255,.25); }
  .site-row .del {
    position: absolute;
    top: 50%;
    right: 8px;
    transform: translateY(-50%);
    width: 22px; height: 22px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,.07);
    color: rgba(255,255,255,.5);
    font-size: 11px;
    line-height: 1;
    cursor: pointer;
    transition: background .18s, color .18s;
  }
  .site-row .del:hover { background: rgba(255,80,80,.28); color: #fff; }

  #btnAddSite {
    width: 100%;
    margin-top: 4px;
    padding: 9px;
    border-radius: 9px;
    border: 1px dashed rgba(255,255,255,.16);
    background: transparent;
    color: rgba(255,255,255,.6);
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    transition: background .18s, color .18s;
  }
  #btnAddSite:hover { background: rgba(255,255,255,.06); color: #fff; }

  body.dragging { cursor: grabbing; }
</style>
</head>
<body>

<div id="wallpaper"></div>
<div id="pages"></div>

<div id="mask"></div>

<aside id="panel">
  <div class="panel-header">
    <h2>设置</h2>
    <button id="btnClose" type="button">✕</button>
  </div>

  <div class="panel-body">

    <section class="sec">
      <h3>壁纸</h3>
      <div class="btn-row">
        <button class="btn" id="btnUpload" type="button">上传图片</button>
        <button class="btn ghost" id="btnResetWall" type="button">恢复默认</button>
      </div>
      <input type="file" id="fileInput" accept="image/*" hidden>
      <div class="field">
        <input type="text" id="wallUrl" placeholder="或粘贴图片链接">
        <button class="btn small" id="btnApplyUrl" type="button">应用</button>
      </div>
    </section>

    <section class="sec">
      <h3>外观</h3>

      <div class="field-row">
        <label>图标大小</label>
        <input type="range" id="rngIconSize" min="36" max="120" step="2">
        <span class="val" id="valIconSize"></span>
      </div>

      <div class="field-row">
        <label>水平间距</label>
        <input type="range" id="rngGapX" min="0" max="80" step="2">
        <span class="val" id="valGapX"></span>
      </div>

      <div class="field-row">
        <label>垂直间距</label>
        <input type="range" id="rngGapY" min="0" max="80" step="2">
        <span class="val" id="valGapY"></span>
      </div>

      <div class="field-row">
        <label>每行图标</label>
        <input type="range" id="rngPerRow" min="2" max="12" step="1">
        <span class="val" id="valPerRow"></span>
      </div>

      <div class="field-row">
        <label>显示网站名</label>
        <input type="checkbox" class="switch" id="chkLabel">
      </div>
      
      <div class="btn-row" style="margin-top: 16px;">
        <button class="btn small ghost" id="btnResetAppearance" type="button" style="width:100%;">恢复默认外观</button>
      </div>
    </section>

    <section class="sec">
      <h3>网站</h3>
      <div class="btn-row">
        <button class="btn small" id="btnExport" type="button">导出 JSON</button>
        <button class="btn small" id="btnImport" type="button">导入 JSON</button>
      </div>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
      
      <div id="siteList"></div>
      <button id="btnAddSite" type="button">+ 添加网站</button>
    </section>

  </div>
</aside>

<script>
(function () {
  'use strict';

  var LS_KEY = 'newtab_state_v1';

  var DEFAULT_SETTINGS = {
    iconSize: 64,
    gapX: 28,
    gapY: 28,
    perRow: 5,
    showLabel: true,
    wallpaper: ''
  };

  var DEFAULT_SITES = [
    { name: 'GitHub',   url: 'https://github.com' },
    { name: '哔哩哔哩', url: 'https://www.bilibili.com' },
    { name: '知乎',     url: 'https://www.zhihu.com' },
    { name: '百度',     url: 'https://www.baidu.com' }
  ];

  var GEAR_SVG =
    '<svg viewBox="0 0 24 24" width="62%" height="62%" fill="none" ' +
    'stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' +
    '<circle cx="12" cy="12" r="3"></circle>' +
    '<path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 ' +
    '1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83' +
    'l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82' +
    'l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 ' +
    '1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4' +
    'h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>';

  var state = {
    settings: Object.assign({}, DEFAULT_SETTINGS),
    items: [],
    page: 0
  };

  var pagesEl = document.getElementById('pages');
  var wallpaperEl = document.getElementById('wallpaper');
  var panelEl = document.getElementById('panel');
  var maskEl = document.getElementById('mask');

  var panelOpen = false;
  var lastDragEnd = 0;
  var lastLongPressTime = 0;

  function loadState() {
    var saved = null;
    try {
      saved = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    } catch (e) { saved = null; }

    if (saved && saved.settings) {
      Object.assign(state.settings, saved.settings);
    }

    if (saved && Array.isArray(saved.items) && saved.items.length) {
      state.items = saved.items.map(function (it, i) {
        return {
          id: it.id || ('i' + i + Math.random().toString(36).slice(2)),
          type: it.type || 'site',
          name: it.name || '',
          url: it.url || ''
        };
      });
    } else {
      state.items = DEFAULT_SITES.map(function (s, i) {
        return { id: 'd' + i, type: 'site', name: s.name, url: s.url };
      });
    }

    ensureSettingsItem();
  }

  function ensureSettingsItem() {
    state.items = state.items.filter(function (it) {
      return it && (it.type === 'settings' || it.url);
    });
    if (!state.items.some(function (it) { return it.type === 'settings'; })) {
      state.items.unshift({ id: 'settings', type: 'settings' });
    }
  }

  function serializeItems() {
    return state.items.map(function (it) {
      return {
        id: it.id,
        type: it.type || 'site',
        name: it.name || '',
        url: it.url || ''
      };
    });
  }

  function save() {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify({
        settings: state.settings,
        items: serializeItems()
      }));
    } catch (e) {
      console.warn('保存失败（可能是壁纸太大）', e);
    }
  }

  function updateLayoutVars() {
    var s = state.settings;
    var root = document.documentElement;
    
    var maxW = window.innerWidth - 40;
    var totalW = s.iconSize * s.perRow + s.gapX * (s.perRow - 1);
    
    var realIconSize = s.iconSize;
    var realGapX = s.gapX;

    if (totalW > maxW && totalW > 0) {
      var scale = maxW / totalW;
      realIconSize = Math.floor(s.iconSize * scale);
      realGapX = Math.floor(s.gapX * scale);
    }

    root.style.setProperty('--icon-size', realIconSize + 'px');
    root.style.setProperty('--gap-x', realGapX + 'px');
    root.style.setProperty('--gap-y', s.gapY + 'px');
    root.style.setProperty('--cols', s.perRow);
    document.body.classList.toggle('show-label', !!s.showLabel);
  }

  function computePerPage() {
    var s = state.settings;
    var labelSize = Math.min(16, Math.max(11, s.iconSize * 0.21));
    var labelH = s.showLabel ? (labelSize * 1.35 + 8) : 0;
    var cellH = s.iconSize + labelH;
    var availH = window.innerHeight - 100; 
    var rows = Math.max(1, Math.floor((availH + s.gapY) / (cellH + s.gapY)));
    return Math.max(1, rows * s.perRow);
  }

  function render() {
    updateLayoutVars();

    state.items.forEach(function (it) {
      if (it._el) {
        it._el.classList.remove('enter');
        it._el.style.removeProperty('--idx');
      }
    });

    var perPage = computePerPage();
    var total = state.items.length;
    var pageCount = Math.max(1, Math.ceil(total / perPage));

    pagesEl.innerHTML = '';

    var grids = [];
    for (var p = 0; p < pageCount; p++) {
      var pageEl = document.createElement('div');
      pageEl.className = 'page';
      var gridEl = document.createElement('div');
      gridEl.className = 'grid';
      pageEl.appendChild(gridEl);
      pagesEl.appendChild(pageEl);
      grids.push(gridEl);
    }

    state.items.forEach(function (item, i) {
      var grid = grids[Math.floor(i / perPage)];
      if (grid) grid.appendChild(getItemEl(item, i));
    });

    if (state.page >= pageCount) state.page = pageCount - 1;
    setPage(state.page, false);
  }

  function getItemEl(item, index) {
    if (!item._el) {
      item._el = createItemEl(item);

      if (!item._animated) {
        var el = item._el;
        el.classList.add('enter');
        el.style.setProperty('--idx', String(Math.min(index || 0, 16)));

        var onEnd = function () {
          el.classList.remove('enter');
          el.style.removeProperty('--idx');
          el.removeEventListener('animationend', onEnd);
        };
        el.addEventListener('animationend', onEnd);

        item._animated = true;
      }
    }
    return item._el;
  }

  function createItemEl(item) {
    if (item.type === 'settings') {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'item item-settings';
      btn._item = item;
      btn.innerHTML = '<span class="icon">' + GEAR_SVG + '</span>';
      btn.addEventListener('click', function () {
        if (Date.now() - lastDragEnd < 300 || Date.now() - lastLongPressTime < 300) return;
        openPanel();
      });
      return btn;
    }

    var a = document.createElement('a');
    a.className = 'item';
    a.href = item.url || '#';
    a.title = item.name || '';
    a.draggable = false;
    a._item = item;

    var iconWrap = document.createElement('span');
    iconWrap.className = 'icon';

    var img = document.createElement('img');
    img.alt = '';
    img.draggable = false;
    img.referrerPolicy = 'no-referrer';

    var step = 0;
    img.addEventListener('error', function () {
      step++;
      if (step === 1) {
        try {
          var u = new URL(item.url);
          img.src = u.origin + '/favicon.ico';
          return;
        } catch (e) { /* ignore */ }
      }
      if (img.parentNode) img.parentNode.removeChild(img);
      if (iconWrap.querySelector('.fallback')) return;
      var fb = document.createElement('span');
      fb.className = 'fallback';
      fb.textContent = (item.name || '?').trim().charAt(0).toUpperCase();
      iconWrap.appendChild(fb);
    });

    img.src = faviconFor(item.url);
    iconWrap.appendChild(img);

    var label = document.createElement('span');
    label.className = 'label';
    label.textContent = item.name || '';

    a.appendChild(iconWrap);
    a.appendChild(label);
    return a;
  }

  function faviconFor(url) {
    try {
      var host = new URL(url).hostname;
      return 'https://www.google.com/s2/favicons?domain=' + encodeURIComponent(host) + '&sz=128';
    } catch (e) {
      return '';
    }
  }

  function setPage(p, animate) {
    var count = pagesEl.children.length;
    p = Math.max(0, Math.min(count - 1, p));
    state.page = p;

    if (animate === false) {
      pagesEl.style.transition = 'none';
    }
    pagesEl.style.transform = 'translateX(' + (-p * 100) + '%)';
    if (animate === false) {
      void pagesEl.offsetHeight;
      pagesEl.style.transition = '';
    }
  }

  function goToPage(p) {
    setPage(p, true);
  }

  var dragState = null;
  var longPressTimer = null;

  function onPointerDown(e) {
    if (panelOpen) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;

    var el = e.target && e.target.closest ? e.target.closest('.item') : null;

    if (!el) {
      longPressTimer = setTimeout(function () {
        lastLongPressTime = Date.now();
        openPanel();
        if (navigator.vibrate) navigator.vibrate(30);
      }, 600);
      return;
    }

    dragState = {
      el: el,
      pointerId: e.pointerId,
      startX: e.clientX,
      startY: e.clientY,
      active: false,
      ghost: null,
      offsetX: 0,
      offsetY: 0
    };

    try { el.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  }

  function onPointerMove(e) {
    if (longPressTimer) {
      clearTimeout(longPressTimer);
      longPressTimer = null;
    }

    if (!dragState || e.pointerId !== dragState.pointerId) return;
    var s = dragState;

    if (!s.active) {
      var dx = e.clientX - s.startX;
      var dy = e.clientY - s.startY;
      if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
      startDrag(e);
    }

    if (!dragState || !dragState.ghost) return;
    e.preventDefault();

    dragState.ghost.style.transform =
      'translate(' + (e.clientX - dragState.offsetX) + 'px,' +
                     (e.clientY - dragState.offsetY) + 'px)';

    updateDropTarget(e);
  }

  function startDrag(e) {
    var s = dragState;
    var rect = s.el.getBoundingClientRect();

    s.active = true;
    s.offsetX = e.clientX - rect.left;
    s.offsetY = e.clientY - rect.top;

    var ghost = s.el.cloneNode(true);
    ghost.className = 'item ghost';
    ghost.classList.remove('enter', 'drag-source');
    ghost.style.animation = 'none';
    ghost.style.removeProperty('--idx');
    ghost.style.width = rect.width + 'px';
    ghost.style.height = rect.height + 'px';
    ghost.style.transform = 'translate(' + rect.left + 'px,' + rect.top + 'px)';
    document.body.appendChild(ghost);
    s.ghost = ghost;

    s.el.classList.add('drag-source');
    document.body.classList.add('dragging');
  }

  function updateDropTarget(e) {
    var s = dragState;
    if (!s || !s.active) return;

    var under = document.elementFromPoint(e.clientX, e.clientY);
    if (!under || !under.closest) return;

    var target = under.closest('.item');
    if (!target || target === s.el || target === s.ghost) return;
    if (target.parentElement !== s.el.parentElement) return;

    var r = target.getBoundingClientRect();
    var before = (e.clientX - r.left) < r.width / 2;
    var ref = before ? target : target.nextSibling;

    if (ref === s.el) return;
    if (s.el.nextSibling === ref) return;

    moveBefore(s.el, ref);
  }

  function moveBefore(item, ref) {
    var parent = item.parentElement;
    if (!parent) return;
    if (ref && ref.parentElement !== parent) return;
    if (item.nextSibling === ref) return;

    var kids = Array.prototype.slice.call(parent.children);
    var first = kids.map(function (k) { return k.getBoundingClientRect(); });

    parent.insertBefore(item, ref);

    kids.forEach(function (k, i) {
      var l = k.getBoundingClientRect();
      var dx = first[i].left - l.left;
      var dy = first[i].top - l.top;
      if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
      k.style.transition = 'none';
      k.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    });

    void parent.offsetHeight;

    kids.forEach(function (k) {
      k.style.transition = 'transform 180ms cubic-bezier(.2,.7,.3,1)';
      k.style.transform = '';
    });

    setTimeout(function () {
      kids.forEach(function (k) {
        k.style.transition = '';
        k.style.transform = '';
      });
    }, 220);
  }

  function onPointerUp(e) {
    if (longPressTimer) {
      clearTimeout(longPressTimer);
      longPressTimer = null;
    }

    if (!dragState || e.pointerId !== dragState.pointerId) return;
    var s = dragState;
    dragState = null;

    try { s.el.releasePointerCapture(e.pointerId); } catch (err) { /* ignore */ }

    if (s.active) {
      lastDragEnd = Date.now();
      if (s.ghost && s.ghost.parentNode) s.ghost.parentNode.removeChild(s.ghost);
      s.el.classList.remove('drag-source');
      s.el.style.transition = '';
      s.el.style.transform = '';
      document.body.classList.remove('dragging');
      commitOrderFromDOM();
    }
  }

  function commitOrderFromDOM() {
    var order = [];
    var grids = pagesEl.querySelectorAll('.grid');
    for (var i = 0; i < grids.length; i++) {
      var children = grids[i].children;
      for (var j = 0; j < children.length; j++) {
        var it = children[j]._item;
        if (it) order.push(it);
      }
    }
    if (order.length === state.items.length) {
      state.items = order;
      save();
    }
  }

  var wheelAcc = 0;
  var wheelTimer = null;
  var wheelLocked = false;

  function onWheel(e) {
    if (panelOpen) return;
    if (dragState) return;
    if (e.ctrlKey) return;

    if (Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;

    e.preventDefault();
    if (wheelLocked) return;

    wheelAcc += e.deltaX;

    clearTimeout(wheelTimer);
    wheelTimer = setTimeout(function () { wheelAcc = 0; }, 220);

    if (Math.abs(wheelAcc) > 80) {
      goToPage(state.page + (wheelAcc > 0 ? 1 : -1));
      wheelAcc = 0;
      wheelLocked = true;
      setTimeout(function () { wheelLocked = false; }, 380);
    }
  }

  var touchStart = null;

  function onTouchStart(e) {
    if (panelOpen) return;
    if (e.touches.length !== 1) { touchStart = null; return; }
    if (e.target.closest && e.target.closest('.item')) { touchStart = null; return; }
    touchStart = {
      x: e.touches[0].clientX,
      y: e.touches[0].clientY
    };
  }

  function onTouchMove(e) {
    if (!touchStart) return;
    var dx = e.touches[0].clientX - touchStart.x;
    var dy = e.touches[0].clientY - touchStart.y;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 12) {
      if (e.cancelable) e.preventDefault();
    }
  }

  function onTouchEnd(e) {
    if (!touchStart) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - touchStart.x;
    var dy = t.clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4) {
      goToPage(state.page + (dx < 0 ? 1 : -1));
    }
  }

  function openPanel() {
    panelOpen = true;
    panelEl.classList.add('open');
    maskEl.classList.add('show');
    syncPanel();
  }

  function closePanel() {
    panelOpen = false;
    panelEl.classList.remove('open');
    maskEl.classList.remove('show');
  }

  function syncPanel() {
    var s = state.settings;

    document.getElementById('rngIconSize').value = s.iconSize;
    document.getElementById('valIconSize').textContent = s.iconSize + 'px';

    document.getElementById('rngGapX').value = s.gapX;
    document.getElementById('valGapX').textContent = s.gapX + 'px';

    document.getElementById('rngGapY').value = s.gapY;
    document.getElementById('valGapY').textContent = s.gapY + 'px';

    document.getElementById('rngPerRow').value = s.perRow;
    document.getElementById('valPerRow').textContent = s.perRow;

    document.getElementById('chkLabel').checked = !!s.showLabel;

    renderSiteList();
  }

  function applyWallpaper() {
    var wp = state.settings.wallpaper;
    if (wp) {
      wallpaperEl.style.backgroundImage = 'url("' + wp.replace(/"/g, '\\"') + '")';
    } else {
      wallpaperEl.style.backgroundImage = '';
    }
  }

  function setWallpaperFromFile(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var MAX = 1920;
        var w = img.width;
        var h = img.height;
        var scale = Math.min(1, MAX / Math.max(w, h));
        w = Math.round(w * scale);
        h = Math.round(h * scale);

        var canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);

        var dataUrl;
        try {
          dataUrl = canvas.toDataURL('image/jpeg', 0.82);
        } catch (e) {
          dataUrl = reader.result;
        }

        state.settings.wallpaper = dataUrl;
        applyWallpaper();
        save();
      };
      img.onerror = function () { /* ignore */ };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  function normalizeUrl(u) {
    u = (u || '').trim();
    if (!u) return '';
    if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(u)) u = 'https://' + u;
    try { new URL(u); return u; } catch (e) { return ''; }
  }

  function exportSites() {
    var sites = state.items
      .filter(function (it) { return it.type !== 'settings' && it.url; })
      .map(function (it) { return { name: it.name || '', url: it.url }; });

    var data = {
      version: 1,
      exportedAt: new Date().toISOString(),
      sites: sites
    };

    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'sites-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function importSites(file) {
    if (!file) return;
    var reader = new FileReader();

    reader.onload = function () {
      try {
        var data = JSON.parse(String(reader.result));
        var arr = Array.isArray(data) ? data : (data && (data.sites || data.items));

        if (!Array.isArray(arr)) throw new Error('JSON 中未找到网站列表');

        var imported = [];
        arr.forEach(function (it, i) {
          if (!it || typeof it !== 'object') return;
          var url = normalizeUrl(it.url || it.href || '');
          if (!url) return;
          var name = String(it.name || it.title || '').trim();
          if (!name) {
            try { name = new URL(url).hostname.replace(/^www\./i, ''); }
            catch (e) { name = '网站'; }
          }
          imported.push({
            id: 'im' + Date.now().toString(36) + i,
            type: 'site',
            name: name,
            url: url
          });
        });

        if (!imported.length) throw new Error('没有有效的网站条目');

        var settingsItem = null;
        for (var k = 0; k < state.items.length; k++) {
          if (state.items[k].type === 'settings') { settingsItem = state.items[k]; break; }
        }
        if (!settingsItem) settingsItem = { id: 'settings', type: 'settings' };

        state.items = [settingsItem].concat(imported);
        ensureSettingsItem();

        save();
        render();
        renderSiteList();

        alert('导入成功，共 ' + imported.length + ' 个网站');
      } catch (err) {
        alert('导入失败：' + (err && err.message ? err.message : '无法解析文件'));
      }
    };

    reader.onerror = function () { alert('读取文件失败'); };
    reader.readAsText(file);
  }

  function renderSiteList() {
    var list = document.getElementById('siteList');
    list.innerHTML = '';

    state.items.forEach(function (item) {
      if (item.type === 'settings') return;

      var row = document.createElement('div');
      row.className = 'site-row';

      var nameInput = document.createElement('input');
      nameInput.type = 'text';
      nameInput.placeholder = '名称';
      nameInput.value = item.name || '';
      nameInput.addEventListener('input', function () {
        item.name = nameInput.value;
        if (item._el) {
          item._el.title = item.name;
          var lb = item._el.querySelector('.label');
          if (lb) lb.textContent = item.name;
        }
        save();
      });

      var urlInput = document.createElement('input');
      urlInput.type = 'text';
      urlInput.placeholder = 'https://example.com';
      urlInput.value = item.url || '';
      urlInput.addEventListener('change', function () {
        var v = normalizeUrl(urlInput.value);
        urlInput.value = v;
        item.url = v;
        item._el = null;
        item._animated = true;
        save();
        render();
      });

      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'del';
      del.textContent = '✕';
      del.addEventListener('click', function () {
        var idx = state.items.indexOf(item);
        if (idx >= 0) state.items.splice(idx, 1);
        if (item._el && item._el.parentNode) item._el.parentNode.removeChild(item._el);
        ensureSettingsItem();
        save();
        render();
        renderSiteList();
      });

      row.appendChild(nameInput);
      row.appendChild(urlInput);
      row.appendChild(del);
      list.appendChild(row);
    });
  }

  function bindEvents() {
    document.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove, { passive: false });
    window.addEventListener('pointerup', onPointerUp);
    window.addEventListener('pointercancel', onPointerUp);

    document.addEventListener('contextmenu', function (e) {
      if (!e.target.closest('input') && !e.target.closest('textarea')) {
        e.preventDefault();
      }
    });

    document.addEventListener('dragstart', function (e) { e.preventDefault(); });

    document.addEventListener('click', function (e) {
      if (Date.now() - lastDragEnd < 300 || Date.now() - lastLongPressTime < 300) {
        e.preventDefault();
        e.stopPropagation();
      }
    }, true);

    window.addEventListener('wheel', onWheel, { passive: false });
    document.addEventListener('touchstart', onTouchStart, { passive: true });
    document.addEventListener('touchmove', onTouchMove, { passive: false });
    document.addEventListener('touchend', onTouchEnd, { passive: true });

    document.addEventListener('keydown', function (e) {
      if (panelOpen) return;
      if (e.key === 'ArrowRight') goToPage(state.page + 1);
      if (e.key === 'ArrowLeft') goToPage(state.page - 1);
    });

    var resizeTimer = null;
    window.addEventListener('resize', function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(render, 150);
    });

    document.getElementById('btnClose').addEventListener('click', closePanel);
    maskEl.addEventListener('click', closePanel);

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && panelOpen) closePanel();
    });

    document.getElementById('btnUpload').addEventListener('click', function () {
      document.getElementById('fileInput').click();
    });
    document.getElementById('fileInput').addEventListener('change', function (e) {
      setWallpaperFromFile(e.target.files && e.target.files[0]);
      e.target.value = '';
    });
    document.getElementById('btnResetWall').addEventListener('click', function () {
      state.settings.wallpaper = '';
      applyWallpaper();
      save();
    });
    document.getElementById('btnApplyUrl').addEventListener('click', function () {
      var input = document.getElementById('wallUrl');
      var v = input.value.trim();
      if (!v) return;
      state.settings.wallpaper = v;
      applyWallpaper();
      save();
      input.value = '';
    });

    function bindRange(id, valId, key, suffix, rerender) {
      var rng = document.getElementById(id);
      var val = document.getElementById(valId);
      var timer = null;

      rng.addEventListener('input', function () {
        var v = Number(rng.value);
        state.settings[key] = v;
        val.textContent = v + suffix;

        updateLayoutVars();
        save();

        if (rerender) {
          clearTimeout(timer);
          timer = setTimeout(render, 180);
        }
      });
    }

    bindRange('rngIconSize', 'valIconSize', 'iconSize', 'px', true);
    bindRange('rngGapX', 'valGapX', 'gapX', 'px', false);
    bindRange('rngGapY', 'valGapY', 'gapY', 'px', true);
    bindRange('rngPerRow', 'valPerRow', 'perRow', '', true);

    document.getElementById('chkLabel').addEventListener('change', function (e) {
      state.settings.showLabel = e.target.checked;
      document.body.classList.toggle('show-label', !!state.settings.showLabel);
      save();
      render();
    });

    document.getElementById('btnResetAppearance').addEventListener('click', function () {
      if (confirm('确定恢复默认外观设置吗？（壁纸不受影响）')) {
        state.settings.iconSize = DEFAULT_SETTINGS.iconSize;
        state.settings.gapX = DEFAULT_SETTINGS.gapX;
        state.settings.gapY = DEFAULT_SETTINGS.gapY;
        state.settings.perRow = DEFAULT_SETTINGS.perRow;
        state.settings.showLabel = DEFAULT_SETTINGS.showLabel;
        save();
        syncPanel();
        render();
      }
    });

    /* 添加网站：追加到末尾，视觉上自动排在最上方，不挤占原有行 */
    document.getElementById('btnAddSite').addEventListener('click', function () {
      var item = {
        id: 'n' + Date.now().toString(36),
        type: 'site',
        name: '新网站',
        url: ''
      };
      
      state.items.push(item);
      save();
      render();
      renderSiteList();

      var list = document.getElementById('siteList');
      var lastRow = list.lastElementChild;
      if (lastRow) {
        var inputs = lastRow.querySelectorAll('input');
        if (inputs[0]) inputs[0].focus();
        lastRow.scrollIntoView({ block: 'nearest' });
      }
    });

    document.getElementById('btnExport').addEventListener('click', exportSites);
    document.getElementById('btnImport').addEventListener('click', function () {
      document.getElementById('importFile').click();
    });
    document.getElementById('importFile').addEventListener('change', function (e) {
      importSites(e.target.files && e.target.files[0]);
      e.target.value = '';
    });
  }

  function init() {
    loadState();
    applyWallpaper();
    bindEvents();
    render();
    syncPanel();
  }

  init();
})();
</script>
</body>
</html>
